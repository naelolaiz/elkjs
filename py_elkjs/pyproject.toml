[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elkjs"
version = "0.11.0"
description = "Pure Python port of ELK.js — automatic graph layout based on Sugiyama's algorithm, specialized for data flow diagrams and ports."
readme = "README.md"
license = {text = "EPL-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "Kiel University and contributors"},
]
keywords = ["graph", "layout", "layered", "ports", "dataflow", "elk", "sugiyama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/kieler/elkjs"
Documentation = "https://www.eclipse.dev/elk/"

[tool.setuptools.packages.find]
include = ["elkjs*"]
